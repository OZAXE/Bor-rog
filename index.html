<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : utilise tout l'écran (encoches) ; user-scalable=no : pas de zoom parasite -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05080a" />
    <!-- Mode "application" quand le jeu est ajouté à l'écran d'accueil -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Bor-rog</title>
    <!-- Police d'inspiration antique (capitales gravées). Si elle ne charge pas, repli sur Georgia. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <!-- Vignettage : assombrit les bords pour concentrer le regard sur le héros -->
      <div id="vignette"></div>

      <!-- Interface superposée au canvas -->
      <div id="hud">
        <div id="debug"></div>
        <div id="top-right">
          <div id="floor-label"></div>
          <div id="seed-label"></div>
        </div>
        <div id="floor-banner"></div>
        <!-- Vie (en bas à gauche, comme dans Hades) -->
        <div id="health">
          <div id="health-bar"><div id="health-fill"></div></div>
          <span id="health-text"></span>
        </div>
        <div id="kills"></div>
        <div id="lock-info"></div>
        <!-- Voile rouge bref quand le héros est touché -->
        <div id="hurt-flash"></div>
      </div>

      <!-- Contrôles tactiles (affichés uniquement sur mobile) -->
      <div id="touch-ui" hidden>
        <div id="joystick-zone"></div>
        <div id="joystick-base"><div id="joystick-knob"></div></div>
        <button id="btn-attack" class="touch-btn" type="button">Frapper</button>
        <button id="btn-dash" class="touch-btn" type="button">Esquiver</button>
      </div>

      <!-- Écran de mort -->
      <div id="death-screen" class="hidden">
        <h2>Tu es tombé</h2>
        <p id="death-text"></p>
        <div class="buttons">
          <button id="btn-retry" type="button">Rejouer cette graine</button>
          <button id="btn-new" type="button">Nouvelle descente</button>
        </div>
      </div>

      <!-- Écran titre / pause -->
      <div id="start-screen">
        <h1>Bor-rog</h1>
        <p class="subtitle">Descends au fond des Enfers</p>
        <p id="start-text">Chargement…</p>
        <p id="start-seed"></p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
