<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : utilise tout l'écran (encoches) ; user-scalable=no : pas de zoom parasite -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0b10" />
    <!-- Mode "application" quand le jeu est ajouté à l'écran d'accueil -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Bor-rog</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <!-- Interface superposée au canvas -->
      <div id="hud">
        <div id="debug"></div>
        <div id="seed-label"></div>
      </div>

      <!-- Écran titre / pause -->
      <div id="start-screen">
        <h1>Bor-rog</h1>
        <p class="subtitle">Un roguelike de donjon</p>
        <p id="start-text">Chargement…</p>
        <p id="start-seed"></p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
