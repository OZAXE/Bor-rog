<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : utilise tout l'écran (encoches) ; user-scalable=no : pas de zoom parasite -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05080a" />
    <!-- Mode "application" quand le jeu est ajouté à l'écran d'accueil -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Bor-rog</title>
    <!-- Police d'inspiration antique (capitales gravées). Si elle ne charge pas, repli sur Georgia. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <!-- Vignettage : assombrit les bords pour concentrer le regard sur le héros -->
      <div id="vignette"></div>

      <!-- Interface superposée au canvas -->
      <div id="hud">
        <div id="debug"></div>
        <div id="top-right">
          <div id="floor-label"></div>
          <div id="seed-label"></div>
        </div>
        <div id="floor-banner"></div>
        <!-- Vie (en bas à gauche, comme dans Hades) -->
        <div id="health">
          <div id="health-bar"><div id="health-fill"></div></div>
          <span id="health-text"></span>
        </div>
        <div id="kills"></div>
        <div id="gold"></div>
        <div id="shadows"></div>
        <div id="boon-list"></div>
        <div id="lock-info"></div>
        <!-- Capacité spéciale (PC) : nom, touche et recharge -->
        <div id="special-hud"><span class="name"></span><span class="bar"><span class="fill"></span></span></div>
        <!-- Vie du boss (en haut de l'écran) -->
        <div id="boss-bar" class="hidden">
          <div id="boss-name"></div>
          <div class="bar"><div id="boss-fill"></div><div class="mark"></div></div>
        </div>
        <!-- Voile rouge bref quand le héros est touché -->
        <div id="hurt-flash"></div>
      </div>

      <!-- Contrôles tactiles (affichés uniquement sur mobile) -->
      <div id="touch-ui" hidden>
        <div id="joystick-zone"></div>
        <div id="joystick-base"><div id="joystick-knob"></div></div>
        <button id="btn-attack" class="touch-btn" type="button">Frapper</button>
        <button id="btn-dash" class="touch-btn" type="button">Esquiver</button>
        <!-- Capacité spéciale : le cercle se remplit pendant la recharge (--charge de 0 à 1) -->
        <button id="btn-special" class="touch-btn" type="button">Spécial</button>
      </div>

      <!-- Bouton pause (PC et mobile), visible pendant la partie -->
      <button id="btn-pause" type="button" aria-label="Pause" hidden><span></span><span></span></button>

      <!-- Menu de pause -->
      <div id="pause-screen" class="hidden">
        <h2>Pause</h2>
        <p id="pause-info"></p>
        <div class="buttons">
          <button id="btn-resume" type="button">Reprendre</button>
          <button id="btn-pause-abandon" type="button">Abandonner la descente</button>
        </div>
        <p id="pause-help"></p>
      </div>

      <!-- Écran de Charon : choix d'un bienfait entre deux étages -->
      <div id="charon" class="hidden">
        <h2 id="charon-title">Charon, le passeur</h2>
        <p class="hint" id="charon-hint">Choisis un bienfait des dieux pour descendre</p>
        <div id="boon-cards"></div>
        <div class="shop">
          <button id="btn-heal" type="button"></button>
          <button id="btn-reroll" type="button"></button>
        </div>
        <p id="charon-gold"></p>
      </div>

      <!-- Écran de victoire -->
      <div id="victory-screen" class="hidden">
        <h2>Tu as vaincu la Mort</h2>
        <p class="hint">Thanatos est tombé. Les Enfers se souviendront de toi.</p>
        <p id="victory-text"></p>
        <div class="buttons">
          <button id="btn-victory-threshold" type="button">Le Seuil</button>
          <button id="btn-victory-new" type="button">Nouvelle descente</button>
        </div>
      </div>

      <!-- Écran de mort -->
      <div id="death-screen" class="hidden">
        <h2>Tu es tombé</h2>
        <p id="death-text"></p>
        <div class="buttons">
          <button id="btn-death-threshold" type="button">Le Seuil</button>
          <button id="btn-new" type="button">Nouvelle descente</button>
          <button id="btn-retry" type="button">Rejouer cette graine</button>
        </div>
      </div>

      <!-- Le Seuil : attributs et arbres de talents, entre deux parties -->
      <div id="threshold" class="hidden">
        <header>
          <h2>Le Seuil</h2>
          <p class="shadows"></p>
          <p class="gained"></p>
        </header>
        <!-- Choix de la classe (une carte par classe ; verrouillée tant que le boss n'est pas vaincu) -->
        <div class="classes"></div>
        <!-- Un onglet par attribut ; un seul arbre affiché à la fois -->
        <nav class="tabs"></nav>
        <section class="attr-card">
          <div class="attr-info"><b class="attr-name"></b><span class="attr-level"></span><span class="attr-bonus"></span></div>
          <button class="btn-level" type="button"></button>
        </section>
        <p class="points"></p>
        <div class="talents">
          <svg class="links" aria-hidden="true"></svg>
          <div class="tiers"></div>
        </div>
        <p class="stats"></p>
        <div class="buttons">
          <button class="btn-descend" type="button">Descendre</button>
          <button class="btn-same-seed" type="button">Rejouer la même graine</button>
          <button class="btn-refund" type="button">Reprendre mes talents</button>
        </div>
        <div class="buttons small">
          <button class="btn-export" type="button">Exporter ma progression</button>
          <button class="btn-import" type="button">Importer un code</button>
        </div>
        <!-- Code d'export / d'import (passer du PC au téléphone, par exemple) -->
        <div class="transfer hidden">
          <p class="transfer-title"></p>
          <textarea spellcheck="false" autocomplete="off"></textarea>
          <p class="transfer-msg"></p>
          <div class="buttons">
            <button class="btn-copy" type="button">Copier</button>
            <button class="btn-load" type="button">Charger ce code</button>
            <button class="btn-close-transfer" type="button">Fermer</button>
          </div>
        </div>
      </div>

      <!-- Écran titre / pause -->
      <div id="start-screen">
        <h1>Bor-rog</h1>
        <p class="subtitle">Descends au fond des Enfers</p>
        <p id="start-text">Chargement…</p>
        <p id="start-seed"></p>
        <div class="buttons">
          <button id="btn-open-threshold" type="button">Le Seuil</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
