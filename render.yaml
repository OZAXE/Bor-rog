# Configuration Render (« Blueprint ») du serveur de Bor-rog.
# Le jeu lui-même reste sur GitHub Pages : seul le serveur tourne ici.
# Render relit ce fichier à chaque modification poussée sur main.
#
# Pas de rootDir : le serveur réutilise le code du jeu (règles du profil, et toute la
# simulation pour les parties en ligne), il lui faut donc tout le dépôt. buildFilter
# limite les redéploiements aux fichiers utiles.
services:
  - type: web
    name: bor-rog-server
    runtime: node
    plan: free # s'endort après 15 min sans visite, ~1 min pour se réveiller
    region: frankfurt # à côté de la base Neon (Francfort)
    buildCommand: cd server && npm ci
    startCommand: node server/index.js
    healthCheckPath: /health
    buildFilter:
      paths:
        - server/**
        - src/meta/**
        - src/systems/**
        - src/state/**
        - src/dungeon/**
        - src/core/**
        - src/net/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Adresse de la base Neon : secret saisi dans le tableau de bord Render,
      # jamais écrit dans le dépôt
      - key: DATABASE_URL
        sync: false
