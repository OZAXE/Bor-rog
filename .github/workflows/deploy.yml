# Construit le jeu avec Vite et le publie sur GitHub Pages.
# Prérequis (une seule fois) : Settings > Pages > Source = "GitHub Actions".
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Permet de lancer le déploiement à la main depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on n'annule pas celui en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Configuration de Pages
        uses: actions/configure-pages@v5

      - name: Envoi du dossier dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publication
        id: deployment
        uses: actions/deploy-pages@v4
