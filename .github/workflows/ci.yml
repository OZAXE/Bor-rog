# Contrôle de chaque Pull Request : tests de simulation + build Vite.
# Une PR n'est fusionnée dans main (donc mise en ligne) que si ce contrôle est vert.
name: Contrôle

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Tests (simulation, génération, déterminisme)
        run: npm test

      - name: Build Vite
        run: npm run build
